name: Android Signed Build

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: '이전 모든 정식 APK·AAB·초안보다 큰 versionCode (첫 빌드 30001 이상 권장)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: aircall-production-release
  cancel-in-progress: false

jobs:
  signed-build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AIRCALL_VERSION_CODE: ${{ inputs.version_code }}
      AIRCALL_RELEASE_CERT_SHA256: ${{ vars.AIRCALL_RELEASE_CERT_SHA256 }}
      GOOGLE_OAUTH_CLIENT_ID_RELEASE: ${{ vars.GOOGLE_OAUTH_CLIENT_ID_RELEASE }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore and validate private signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          AIRCALL_KEYSTORE_BASE64: ${{ secrets.AIRCALL_KEYSTORE_BASE64 }}
          AIRCALL_KEYSTORE_PASSWORD: ${{ secrets.AIRCALL_KEYSTORE_PASSWORD }}
          AIRCALL_KEY_ALIAS: ${{ secrets.AIRCALL_KEY_ALIAS }}
          AIRCALL_KEY_PASSWORD: ${{ secrets.AIRCALL_KEY_PASSWORD }}
        run: python scripts/prepare_release_signing.py
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - name: Download pinned bundletool
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          echo 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  '"$RUNNER_TEMP/bundletool.jar" | sha256sum --check
      - name: Tests, lint and privately signed APK/AAB
        run: |
          python -m unittest discover -s scripts -p 'test_*.py' -v
          gradle --no-daemon --console=plain testReleaseUnitTest lintRelease assembleRelease bundleRelease \
            -PAIRCALL_VERSION_CODE="$AIRCALL_VERSION_CODE" \
            -PAIRCALL_DISTRIBUTION_CHANNEL=direct \
            -PGOOGLE_OAUTH_CLIENT_ID="$GOOGLE_OAUTH_CLIENT_ID_RELEASE" --stacktrace
      - name: Verify signed APK/AAB and update history
        run: |
          mkdir -p dist
          VERSION=$(sed -n 's/^versionName=//p' version.properties)
          cp app/build/outputs/apk/release/app-release.apk "dist/aircall-$VERSION-$AIRCALL_VERSION_CODE.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/aircall-$VERSION-$AIRCALL_VERSION_CODE.aab"
          python scripts/verify_apk.py "dist/aircall-$VERSION-$AIRCALL_VERSION_CODE.apk" \
            --build-tools "$ANDROID_HOME/build-tools/35.0.0" \
            --package com.woojik.aircallai.release --version-code "$AIRCALL_VERSION_CODE" \
            --certificate "$AIRCALL_RELEASE_CERT_SHA256" --release --output dist/release-metadata.json
          python scripts/check_release_history.py dist/release-metadata.json --repository "$GITHUB_REPOSITORY"
          python scripts/verify_aab.py "dist/aircall-$VERSION-$AIRCALL_VERSION_CODE.aab" \
            --bundletool "$RUNNER_TEMP/bundletool.jar" --certificate "$AIRCALL_RELEASE_CERT_SHA256" \
            --build-tools "$ANDROID_HOME/build-tools/35.0.0" \
            --package com.woojik.aircallai.release --version-code "$AIRCALL_VERSION_CODE" \
            --output dist/bundle-metadata.json
          cp CHANGELOG.md dist/CHANGELOG.md
          (cd dist && sha256sum *.apk *.aab > SHA256SUMS.txt)
          echo "RELEASE_TAG=v$VERSION-build.$AIRCALL_VERSION_CODE" >> "$GITHUB_ENV"
          echo '### 개인 키로 서명된 테스트 빌드' >> "$GITHUB_STEP_SUMMARY"
          echo "aircall-signed-build ZIP에서 aircall-$VERSION-$AIRCALL_VERSION_CODE.apk를 꺼내 설치하세요." >> "$GITHUB_STEP_SUMMARY"
          echo '스토어 제출 조건·정식 Google OAuth·실기 동작 검증은 별도입니다. 원스토어 제출은 ONE store Release를 사용하세요.' >> "$GITHUB_STEP_SUMMARY"
      - name: Reserve signing identity and version in a private release draft
        run: gh release create "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease --title "AirCall AI $RELEASE_TAG · Signed test build" --notes-file CHANGELOG.md
      - name: Upload verified signed APK/AAB
        uses: actions/upload-artifact@v4
        with:
          name: aircall-signed-build
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Remove private signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/aircall-release.jks"
