name: Android Release

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: '새 정식 릴리스 versionCode (이전 릴리스·초안보다 커야 함, 첫 권장값 30000)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: aircall-production-release
  cancel-in-progress: false

jobs:
  signed-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AIRCALL_VERSION_CODE: ${{ inputs.version_code }}
      AIRCALL_KEYSTORE_PASSWORD: ${{ secrets.AIRCALL_KEYSTORE_PASSWORD }}
      AIRCALL_KEY_ALIAS: ${{ secrets.AIRCALL_KEY_ALIAS }}
      AIRCALL_KEY_PASSWORD: ${{ secrets.AIRCALL_KEY_PASSWORD }}
      AIRCALL_RELEASE_CERT_SHA256: ${{ vars.AIRCALL_RELEASE_CERT_SHA256 }}
      GOOGLE_OAUTH_CLIENT_ID_RELEASE: ${{ vars.GOOGLE_OAUTH_CLIENT_ID_RELEASE }}
      AIRCALL_DEVELOPER_NAME: ${{ vars.AIRCALL_DEVELOPER_NAME }}
      AIRCALL_SUPPORT_EMAIL: ${{ vars.AIRCALL_SUPPORT_EMAIL }}
      AIRCALL_PRIVACY_POLICY_URL: ${{ vars.AIRCALL_PRIVACY_POLICY_URL }}
      AIRCALL_REPORT_ENDPOINT: ${{ vars.AIRCALL_REPORT_ENDPOINT }}
      AIRCALL_REPORT_RETENTION_DAYS: ${{ vars.AIRCALL_REPORT_RETENTION_DAYS }}
      AIRCALL_REQUIRE_PLAY_CONFIG: 'true'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - name: Require working public policy and anonymous report receiver
        run: python scripts/check_play_config.py --network --policy-output dist/privacy-policy.html
      - name: Download pinned bundletool
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          echo 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  '"$RUNNER_TEMP/bundletool.jar" | sha256sum --check
      - name: Require production signing and restore private keystore
        env:
          AIRCALL_KEYSTORE_BASE64: ${{ secrets.AIRCALL_KEYSTORE_BASE64 }}
        run: |
          python - <<'PY'
          import base64, os, re
          from pathlib import Path
          names = ['AIRCALL_KEYSTORE_BASE64', 'AIRCALL_KEYSTORE_PASSWORD', 'AIRCALL_KEY_ALIAS', 'AIRCALL_KEY_PASSWORD', 'AIRCALL_RELEASE_CERT_SHA256', 'GOOGLE_OAUTH_CLIENT_ID_RELEASE']
          missing = [name for name in names if not os.environ.get(name)]
          if missing: raise SystemExit('Production release configuration missing: ' + ', '.join(missing))
          code = os.environ['AIRCALL_VERSION_CODE']
          if not code.isdigit() or not 30000 <= int(code) <= 2100000000: raise SystemExit('Invalid production versionCode')
          digest = os.environ['AIRCALL_RELEASE_CERT_SHA256'].replace(':', '').lower()
          if not re.fullmatch('[a-f0-9]{64}', digest): raise SystemExit('Invalid certificate SHA-256')
          if digest == '80aa900bdf23c5abde473e24875ce91adbc0882f86f3d3dbd5b42a7e866c5bf4': raise SystemExit('Development certificate must never sign production releases')
          target = Path(os.environ['RUNNER_TEMP']) / 'aircall-release.jks'
          target.write_bytes(base64.b64decode(os.environ['AIRCALL_KEYSTORE_BASE64'], validate=True))
          target.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'AIRCALL_KEYSTORE_PATH={target}\nAIRCALL_REQUIRE_RELEASE_SIGNING=true\n')
          PY
      - name: Tests and signed APK/AAB
        run: |
          python -m unittest discover -s scripts -p 'test_*.py' -v
          node --test support/report-receiver/receiver.test.cjs
          gradle --no-daemon --console=plain testReleaseUnitTest lintRelease assembleRelease bundleRelease \
            -PAIRCALL_VERSION_CODE="$AIRCALL_VERSION_CODE" \
            -PGOOGLE_OAUTH_CLIENT_ID="$GOOGLE_OAUTH_CLIENT_ID_RELEASE" --stacktrace
      - name: Verify identity, signing, native compatibility and update history
        run: |
          mkdir -p dist
          VERSION=$(sed -n 's/^versionName=//p' version.properties)
          cp app/build/outputs/apk/release/app-release.apk "dist/aircall-$VERSION-$AIRCALL_VERSION_CODE.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/aircall-$VERSION-$AIRCALL_VERSION_CODE.aab"
          python scripts/verify_apk.py "dist/aircall-$VERSION-$AIRCALL_VERSION_CODE.apk" \
            --build-tools "$ANDROID_HOME/build-tools/35.0.0" \
            --package com.woojik.aircallai.release --version-code "$AIRCALL_VERSION_CODE" \
            --certificate "$AIRCALL_RELEASE_CERT_SHA256" --release --output dist/release-metadata.json
          python scripts/check_release_history.py dist/release-metadata.json --repository "$GITHUB_REPOSITORY"
          jarsigner -verify "dist/aircall-$VERSION-$AIRCALL_VERSION_CODE.aab" > "$RUNNER_TEMP/aab-signature.txt"
          grep -q 'jar verified' "$RUNNER_TEMP/aab-signature.txt"
          python scripts/verify_aab.py "dist/aircall-$VERSION-$AIRCALL_VERSION_CODE.aab" \
            --bundletool "$RUNNER_TEMP/bundletool.jar" --certificate "$AIRCALL_RELEASE_CERT_SHA256" \
            --build-tools "$ANDROID_HOME/build-tools/35.0.0" \
            --package com.woojik.aircallai.release --version-code "$AIRCALL_VERSION_CODE" \
            --output dist/play-bundle-metadata.json
          (cd dist && sha256sum *.apk *.aab > SHA256SUMS.txt)
          echo "RELEASE_TAG=v$VERSION-build.$AIRCALL_VERSION_CODE" >> "$GITHUB_ENV"
          echo '### Google Play 제출 파일' >> "$GITHUB_STEP_SUMMARY"
          echo "Play Console에는 aircall-$VERSION-$AIRCALL_VERSION_CODE.aab를 업로드하세요. APK는 직접 설치용입니다." >> "$GITHUB_STEP_SUMMARY"
          echo '업로드 키와 Play 앱 서명키가 다르면 직접 설치 APK와 Play 설치 앱은 서로 업데이트할 수 없습니다.' >> "$GITHUB_STEP_SUMMARY"
          echo '개발자 계정·스토어 정보·데이터 보안·콘텐츠 등급·FGS 선언·OAuth 심사 및 실기 테스트는 docs/play/README.md를 확인하세요.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aircall-signed-release
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Create reviewable release draft
        run: gh release create "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease --title "AirCall AI $RELEASE_TAG" --notes-file CHANGELOG.md
      - name: Remove private signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/aircall-release.jks"
