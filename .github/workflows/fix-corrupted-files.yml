name: Fix corrupted sources
on:
  push:
    branches: [prd-09-google-android-client]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix GoogleOAuthClient regex lines
        run: |
          python3 - <<'EOF'
          import pathlib
          p = pathlib.Path('app/src/main/java/com/woojik/aircallai/auth/GoogleOAuthClient.kt')
          s = p.read_text()
          good1 = r'            Regex("\"" + key + "\"\\s*:\\s*\"([^\\"]*)\"").find(body)?.groupValues?.get(1)'
          good2 = r'            Regex("\"" + key + "\"\\s*:\\s*(-?\\d+)").find(body)?.groupValues?.get(1)?.toLongOrNull()'
          lines = s.split('\n')
          hits = 0
          for i, l in enumerate(lines):
              prev = lines[i-1] if i > 0 else ''
              if l.strip().startswith('Regex(') and 'extractString' in prev:
                  lines[i] = good1
                  hits += 1
              elif l.strip().startswith('Regex(') and 'extractNumber' in prev:
                  lines[i] = good2
                  hits += 1
          s2 = '\n'.join(lines)
          if s2 != s:
              p.write_text(s2)
              print('fixed lines:', hits)
          else:
              print('no changes needed')
          EOF
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "fix: GoogleOAuthClient 정규식 라인 복구" && git push)
