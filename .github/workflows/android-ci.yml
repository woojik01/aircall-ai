name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Unit tests
        timeout-minutes: 10
        run: |
          set +e
          timeout --signal=TERM --kill-after=30s 8m gradle --no-daemon --console=plain testDebugUnitTest --stacktrace > /tmp/tests.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            {
              echo '### ❌ testDebugUnitTest 실패 또는 시간 초과'
              echo '~~~'
              tail -n 200 /tmp/tests.log
              echo '~~~'
            } > /tmp/comment.md
            if [ -n "$NUMBER" ]; then
              gh pr comment "$NUMBER" --repo "$REPO" --body-file /tmp/comment.md || true
            fi
          fi
          exit $code
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
      - name: Build debug APK
        timeout-minutes: 5
        run: gradle --no-daemon --console=plain assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aircall-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
