name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Set up Android SDK command line tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - name: Prepare Android SDK and stable development identity
        run: |
          test -f app/debug.keystore
          echo "AIRCALL_VERSION_CODE=$((30000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          keytool -list -v -keystore app/debug.keystore -alias androiddebugkey -storepass android >> "$GITHUB_STEP_SUMMARY"
      - name: Release verification unit tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Android unit tests
        timeout-minutes: 12
        run: gradle --no-daemon --console=plain testDebugUnitTest testReleaseUnitTest lintRelease -PAIRCALL_VERSION_CODE="$AIRCALL_VERSION_CODE" -PAIRCALL_DISTRIBUTION_CHANNEL=onestore --stacktrace
      - name: Download pinned bundletool
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          echo 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  '"$RUNNER_TEMP/bundletool.jar" | sha256sum --check
      - name: Build debug and shrink production code
        timeout-minutes: 10
        env:
          AIRCALL_KEYSTORE_PATH: ${{ runner.temp }}/ci-test-release.jks
          AIRCALL_KEYSTORE_PASSWORD: ci-test-only
          AIRCALL_KEY_ALIAS: ci-test
          AIRCALL_KEY_PASSWORD: ci-test-only
          AIRCALL_REQUIRE_RELEASE_SIGNING: 'true'
        run: |
          # This disposable test key is only for validating signing. Its APK/AAB is never uploaded.
          keytool -genkeypair -keystore "$AIRCALL_KEYSTORE_PATH" -storepass:env AIRCALL_KEYSTORE_PASSWORD \
            -keypass:env AIRCALL_KEY_PASSWORD -alias "$AIRCALL_KEY_ALIAS" -keyalg RSA -keysize 2048 \
            -validity 2 -dname "CN=CI Test Only"
          gradle --no-daemon --console=plain assembleDebug assembleDebugAndroidTest assembleRelease bundleRelease -PAIRCALL_VERSION_CODE="$AIRCALL_VERSION_CODE" -PAIRCALL_DISTRIBUTION_CHANNEL=onestore --stacktrace
          CERT=$(keytool -list -v -keystore "$AIRCALL_KEYSTORE_PATH" -storepass:env AIRCALL_KEYSTORE_PASSWORD | sed -n 's/.*SHA256: //p')
          python scripts/verify_apk.py app/build/outputs/apk/release/app-release.apk \
            --build-tools "$ANDROID_HOME/build-tools/35.0.0" \
            --package com.woojik.aircallai.release --version-code "$AIRCALL_VERSION_CODE" \
            --certificate "$CERT" --release --output "$RUNNER_TEMP/test-release-metadata.json"
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab > "$RUNNER_TEMP/test-aab-signature.txt"
          grep -q 'jar verified' "$RUNNER_TEMP/test-aab-signature.txt"
          python scripts/verify_aab.py app/build/outputs/bundle/release/app-release.aab \
            --bundletool "$RUNNER_TEMP/bundletool.jar" --certificate "$CERT" \
            --build-tools "$ANDROID_HOME/build-tools/35.0.0" \
            --package com.woojik.aircallai.release --version-code "$AIRCALL_VERSION_CODE" \
            --output "$RUNNER_TEMP/test-aab-metadata.json"
      - name: Verify diagnostic code is excluded from production
        run: python scripts/verify_debug_diagnostics.py app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk
      - name: Verify installable development APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/aircall-dev.apk
          python scripts/verify_apk.py dist/aircall-dev.apk \
            --build-tools "$ANDROID_HOME/build-tools/35.0.0" \
            --package com.woojik.aircallai --version-code "$AIRCALL_VERSION_CODE" \
            --certificate '80:AA:90:0B:DF:23:C5:AB:DE:47:3E:24:87:5C:E9:1A:DB:C0:88:2F:86:F3:D3:DB:D5:B4:2A:7E:86:6C:5B:F4' \
            --output dist/build-metadata.json
          (cd dist && sha256sum aircall-dev.apk > SHA256SUMS.txt)
          echo '### 검증된 개발용 APK' >> "$GITHUB_STEP_SUMMARY"
          echo 'aircall-debug-apk에서 ZIP을 풀고 aircall-dev.apk를 설치하세요. 정식 배포용 패키지는 별도입니다.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aircall-debug-apk
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload upgrade test APK
        uses: actions/upload-artifact@v4
        with:
          name: aircall-upgrade-test-apk
          path: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove disposable CI signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/ci-test-release.jks"


  verify-update:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aircall-debug-apk
          path: upgrade/current
      - uses: actions/download-artifact@v4
        with:
          name: aircall-upgrade-test-apk
          path: upgrade/test
      - name: Find previous successful main APK
        id: baseline
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: 'android-ci.yml', branch: 'main', event: 'push',
              status: 'success', per_page: 30,
            });
            for (const run of runs.data.workflow_runs) {
              if (run.head_sha === context.sha) continue;
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner, repo: context.repo.repo, run_id: run.id,
              });
              if (artifacts.data.artifacts.some(a => a.name === 'aircall-debug-apk' && !a.expired)) {
                core.setOutput('run_id', run.id);
                return;
              }
            }
            core.setFailed('No previous APK available: cannot verify an in-place update.');
      - name: Download previous APK
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_RUN: ${{ steps.baseline.outputs.run_id }}
        run: gh run download "$BASELINE_RUN" --repo "$GITHUB_REPOSITORY" --name aircall-debug-apk --dir upgrade/baseline
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify settings, credentials, chats, notes and model files after update
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install upgrade/baseline/aircall-dev.apk
            adb install upgrade/test/app-debug-androidTest.apk
            adb shell am instrument -w -e phase seed -e class com.woojik.aircallai.UpdatePersistenceTest com.woojik.aircallai.test/androidx.test.runner.AndroidJUnitRunner > upgrade/seed.txt
            cat upgrade/seed.txt
            grep -q 'OK (2 tests)' upgrade/seed.txt
            adb shell am force-stop com.woojik.aircallai
            adb install -r upgrade/current/aircall-dev.apk
            adb shell pm grant com.woojik.aircallai android.permission.POST_NOTIFICATIONS
            adb shell am instrument -w -e phase verify -e class com.woojik.aircallai.UpdatePersistenceTest com.woojik.aircallai.test/androidx.test.runner.AndroidJUnitRunner > upgrade/verify.txt
            cat upgrade/verify.txt
            adb logcat -d -b crash > upgrade/crashes.txt
            adb logcat -d > upgrade/device-logcat.txt
            adb shell dumpsys activity activities > upgrade/activity-state.txt
            grep -q 'OK (2 tests)' upgrade/verify.txt
            adb shell am instrument -w -e phase crash -e class com.woojik.aircallai.CrashDiagnosticsTest com.woojik.aircallai.test/androidx.test.runner.AndroidJUnitRunner > upgrade/diagnostic-crash.txt || true
            cat upgrade/diagnostic-crash.txt
            adb shell run-as com.woojik.aircallai cat no_backup/debug-last-crash.txt > upgrade/diagnostic-saved.txt
            grep -q 'java.lang.IllegalStateException' upgrade/diagnostic-saved.txt
            if grep -q 'secret-test-token' upgrade/diagnostic-saved.txt; then exit 1; fi
            adb shell am instrument -w -e phase diagnostic-verify -e class com.woojik.aircallai.CrashDiagnosticsTest com.woojik.aircallai.test/androidx.test.runner.AndroidJUnitRunner > upgrade/diagnostic-verify.txt
            cat upgrade/diagnostic-verify.txt
            grep -q 'OK (1 test)' upgrade/diagnostic-verify.txt
            adb shell pm revoke com.woojik.aircallai android.permission.POST_NOTIFICATIONS
            adb shell am instrument -w -e phase blocked -e class com.woojik.aircallai.DebugDiagnosticsAccessTest com.woojik.aircallai.test/androidx.test.runner.AndroidJUnitRunner > upgrade/diagnostic-blocked.txt
            cat upgrade/diagnostic-blocked.txt
            grep -q 'OK (1 test)' upgrade/diagnostic-blocked.txt
            adb shell pm grant com.woojik.aircallai android.permission.POST_NOTIFICATIONS
            adb shell am instrument -w -e phase repost -e class com.woojik.aircallai.DebugDiagnosticsAccessTest com.woojik.aircallai.test/androidx.test.runner.AndroidJUnitRunner > upgrade/diagnostic-repost.txt
            cat upgrade/diagnostic-repost.txt
            grep -q 'OK (1 test)' upgrade/diagnostic-repost.txt
      - name: Upload update verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aircall-update-verification
          path: upgrade/*.txt
          if-no-files-found: ignore
