name: Android CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Unit tests
        run: |
          set +e
          gradle testDebugUnitTest --stacktrace > /tmp/tests.log 2>&1
          code=$?
          {
            echo '## Unit tests output'
            echo '~~~'
            tail -n 150 /tmp/tests.log
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code
      - name: Build debug APK
        run: gradle assembleDebug
