name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Set up Android SDK command line tools
        uses: android-actions/setup-android@v3
      - name: Prepare Android SDK and stable development identity
        run: |
          test -f app/debug.keystore
          sdkmanager "platforms;android-36" "build-tools;35.0.0"
          echo "AIRCALL_VERSION_CODE=$((30000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          keytool -list -v -keystore app/debug.keystore -alias androiddebugkey -storepass android >> "$GITHUB_STEP_SUMMARY"
      - name: Release verification unit tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Android unit tests
        timeout-minutes: 12
        run: gradle --no-daemon --console=plain testDebugUnitTest testReleaseUnitTest -PAIRCALL_VERSION_CODE="$AIRCALL_VERSION_CODE" --stacktrace
      - name: Build debug and shrink production code
        timeout-minutes: 10
        run: gradle --no-daemon --console=plain assembleDebug assembleRelease bundleRelease -PAIRCALL_VERSION_CODE="$AIRCALL_VERSION_CODE" --stacktrace
      - name: Verify installable development APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/aircall-dev.apk
          python scripts/verify_apk.py dist/aircall-dev.apk \
            --build-tools "$ANDROID_HOME/build-tools/35.0.0" \
            --package com.woojik.aircallai --version-code "$AIRCALL_VERSION_CODE" \
            --certificate '80:AA:90:0B:DF:23:C5:AB:DE:47:3E:24:87:5C:E9:1A:DB:C0:88:2F:86:F3:D3:DB:D5:B4:2A:7E:86:6C:5B:F4' \
            --output dist/build-metadata.json
          (cd dist && sha256sum aircall-dev.apk > SHA256SUMS.txt)
          echo '### 검증된 개발용 APK' >> "$GITHUB_STEP_SUMMARY"
          echo 'aircall-debug-apk에서 ZIP을 풀고 aircall-dev.apk를 설치하세요. 정식 배포용 패키지는 별도입니다.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aircall-debug-apk
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
