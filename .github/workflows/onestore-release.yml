name: ONE store Release

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: '이전 모든 정식 APK·AAB·초안보다 큰 versionCode'
        required: true
        type: string

permissions:
  contents: write

# Play와 원스토어가 같은 정식 패키지/키/버전 이력을 공유한다.
concurrency:
  group: aircall-production-release
  cancel-in-progress: false

jobs:
  signed-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AIRCALL_VERSION_CODE: ${{ inputs.version_code }}
      AIRCALL_DISTRIBUTION_CHANNEL: onestore
      AIRCALL_ONESTORE_PRODUCT_ID: ${{ vars.AIRCALL_ONESTORE_PRODUCT_ID }}
      AIRCALL_KEYSTORE_PASSWORD: ${{ secrets.AIRCALL_KEYSTORE_PASSWORD }}
      AIRCALL_KEY_ALIAS: ${{ secrets.AIRCALL_KEY_ALIAS }}
      AIRCALL_KEY_PASSWORD: ${{ secrets.AIRCALL_KEY_PASSWORD }}
      AIRCALL_RELEASE_CERT_SHA256: ${{ vars.AIRCALL_RELEASE_CERT_SHA256 }}
      GOOGLE_OAUTH_CLIENT_ID_RELEASE: ${{ vars.GOOGLE_OAUTH_CLIENT_ID_RELEASE }}
      AIRCALL_DEVELOPER_NAME: ${{ vars.AIRCALL_DEVELOPER_NAME }}
      AIRCALL_SUPPORT_EMAIL: ${{ vars.AIRCALL_SUPPORT_EMAIL }}
      AIRCALL_PRIVACY_POLICY_URL: ${{ vars.AIRCALL_PRIVACY_POLICY_URL }}
      AIRCALL_REPORT_ENDPOINT: ${{ vars.AIRCALL_REPORT_ENDPOINT }}
      AIRCALL_REPORT_RETENTION_DAYS: ${{ vars.AIRCALL_REPORT_RETENTION_DAYS }}
      AIRCALL_REQUIRE_STORE_CONFIG: 'true'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - name: Require ONEconsole PID, working policy and report receiver
        run: |
          python scripts/prepare_onestore_submission.py --require-product-id --network
          python - <<'PY'
          import os
          import sys
          sys.path.insert(0, 'scripts')
          from prepare_onestore_submission import load_product_id
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('AIRCALL_ONESTORE_PRODUCT_ID=' + load_product_id('config/onestore.properties') + '\n')
          PY
      - name: Require production signing and restore private keystore
        env:
          AIRCALL_KEYSTORE_BASE64: ${{ secrets.AIRCALL_KEYSTORE_BASE64 }}
        run: |
          python - <<'PY'
          import base64, os, re
          from pathlib import Path
          names = ['AIRCALL_KEYSTORE_BASE64', 'AIRCALL_KEYSTORE_PASSWORD', 'AIRCALL_KEY_ALIAS', 'AIRCALL_KEY_PASSWORD', 'AIRCALL_RELEASE_CERT_SHA256', 'GOOGLE_OAUTH_CLIENT_ID_RELEASE']
          missing = [name for name in names if not os.environ.get(name)]
          if missing: raise SystemExit('Production release configuration missing: ' + ', '.join(missing))
          code = os.environ['AIRCALL_VERSION_CODE']
          if not code.isdigit() or not 30000 <= int(code) <= 2100000000: raise SystemExit('Invalid production versionCode')
          digest = os.environ['AIRCALL_RELEASE_CERT_SHA256'].replace(':', '').lower()
          if not re.fullmatch('[a-f0-9]{64}', digest): raise SystemExit('Invalid certificate SHA-256')
          if digest == '80aa900bdf23c5abde473e24875ce91adbc0882f86f3d3dbd5b42a7e866c5bf4': raise SystemExit('Development certificate must never sign production releases')
          target = Path(os.environ['RUNNER_TEMP']) / 'aircall-release.jks'
          target.write_bytes(base64.b64decode(os.environ['AIRCALL_KEYSTORE_BASE64'], validate=True))
          target.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'AIRCALL_KEYSTORE_PATH={target}\nAIRCALL_REQUIRE_RELEASE_SIGNING=true\n')
          PY
      - name: Tests, lint and signed ONE store APK
        run: |
          python -m unittest discover -s scripts -p 'test_*.py' -v
          node --test support/report-receiver/receiver.test.cjs
          gradle --no-daemon --console=plain testReleaseUnitTest lintRelease assembleRelease \
            -PAIRCALL_VERSION_CODE="$AIRCALL_VERSION_CODE" \
            -PAIRCALL_DISTRIBUTION_CHANNEL=onestore \
            -PAIRCALL_ONESTORE_PRODUCT_ID="$AIRCALL_ONESTORE_PRODUCT_ID" \
            -PGOOGLE_OAUTH_CLIENT_ID="$GOOGLE_OAUTH_CLIENT_ID_RELEASE" --stacktrace
      - name: Verify APK identity, certificate, native compatibility and update history
        run: |
          VERSION=$(sed -n 's/^versionName=//p' version.properties)
          cp app/build/outputs/apk/release/app-release.apk "dist/aircall-onestore-$VERSION-$AIRCALL_VERSION_CODE.apk"
          python scripts/verify_apk.py "dist/aircall-onestore-$VERSION-$AIRCALL_VERSION_CODE.apk" \
            --build-tools "$ANDROID_HOME/build-tools/35.0.0" \
            --package com.woojik.aircallai.release --version-code "$AIRCALL_VERSION_CODE" \
            --certificate "$AIRCALL_RELEASE_CERT_SHA256" --release --output dist/release-metadata.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('dist/release-metadata.json')
          data = json.loads(path.read_text())
          data.update(distributionChannel='onestore', oneStoreProductId=os.environ['AIRCALL_ONESTORE_PRODUCT_ID'])
          path.write_text(json.dumps(data, indent=2) + '\n')
          PY
          python scripts/check_release_history.py dist/release-metadata.json --repository "$GITHUB_REPOSITORY"
          python scripts/prepare_onestore_submission.py --require-product-id --metadata dist/release-metadata.json
          cp CHANGELOG.md dist/CHANGELOG.md
          (cd dist && sha256sum *.apk *.html *.md *.json > SHA256SUMS.txt)
          echo "RELEASE_TAG=v$VERSION-build.$AIRCALL_VERSION_CODE" >> "$GITHUB_ENV"
          echo '### 원스토어 제출 파일' >> "$GITHUB_STEP_SUMMARY"
          echo "ONEconsole에는 aircall-onestore-$VERSION-$AIRCALL_VERSION_CODE.apk를 업로드하세요." >> "$GITHUB_STEP_SUMMARY"
          echo '개발용 APK는 제출할 수 없습니다. 계정·상품 정보·스크린샷·실기 검증은 docs/onestore/README.md를 확인하세요.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload signed ONE store submission pack
        uses: actions/upload-artifact@v4
        with:
          name: aircall-onestore-submission
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Create reviewable release draft
        run: gh release create "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease --title "AirCall AI $RELEASE_TAG · ONE store" --notes-file dist/SUBMISSION.md
      - name: Remove private signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/aircall-release.jks"
