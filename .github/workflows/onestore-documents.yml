name: Prepare ONE store Documents

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documents:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AIRCALL_DEVELOPER_NAME: ${{ vars.AIRCALL_DEVELOPER_NAME }}
      AIRCALL_SUPPORT_EMAIL: woojik1220@gmail.com
      AIRCALL_PRIVACY_POLICY_URL: ${{ vars.AIRCALL_PRIVACY_POLICY_URL }}
      AIRCALL_ONESTORE_PRODUCT_ID: ${{ vars.AIRCALL_ONESTORE_PRODUCT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare reviewable policy and ONEconsole documents
        run: |
          python scripts/prepare_onestore_submission.py
          echo 'privacy-policy.html을 공개 HTTPS 주소에 게시하세요. 이 작업은 웹 게시나 스토어 제출을 하지 않습니다.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: aircall-onestore-documents
          path: dist/*
          if-no-files-found: error
          retention-days: 30
